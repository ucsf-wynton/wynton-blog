project:
  type: website

website:
  title: "The UCSF Wynton Blog"
  
  site-url: https://blog.wynton.ucsf.edu

  description: "The UCSF Wynton Blog"

  favicon: images/favicon.ico

  navbar:
    logo: "images/logo.png"
    logo-alt: "Return to the Wynton Blog front page"
  
    right:
      - about.qmd
      - icon: house
        href: https://wynton.ucsf.edu/hpc/
        aria-label: "Wynton HPC website"
      - icon: github
        href: https://github.com/ucsf-wynton/wynton-blog
        aria-label: "Wynton Blog GitHub repository"
      - icon: rss
        href: index.xml
        aria-label: "Wynton Blog RSS feed"

  draft-mode: visible

  repo-url: https://github.com/ucsf-wynton/wynton-blog
  repo-actions: [edit, source]

  google-analytics:
    tracking-id: "UA-128646955-1"

format:
  html:
    theme: cosmo
    css:
    - assets/css/this_site.css
    axe:
      output: console

execute:
  freeze: auto

draft-mode: visible

resources:
  - CNAME
